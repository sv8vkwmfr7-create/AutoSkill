[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoskill"
version = "1.1.0"
description = "面向 Agent 的自进化技能生成与热加载系统 | Self-evolving skill generation & hot-reload for Agents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "openai>=1.40",
    "chromadb>=0.5",
    "jsonschema>=4.20",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
autoskill = "autoskill.__main__:main"

[tool.setuptools]
packages = ["autoskill", "autoskill.executor"]
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]  # 行长由 formatter 视角处理，重点抓错误类问题
